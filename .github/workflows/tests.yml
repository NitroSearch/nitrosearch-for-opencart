name: Tests

# This module had NO continuous integration and no test runner at all until now.
# Everything that has ever been verified here was verified by hand, against two
# sandbox shops — which is why 1.0.0 and 1.1.0 both shipped without a way for a
# merchant to decline usage sharing, and why 1.1.0 was needed at all to add an
# unattended heartbeat the first release never had. Neither is the kind of defect
# using the module reveals: both are absences, and an absence has no broken
# behaviour to notice.
#
# WHAT THIS CAN AND CANNOT SEE. `tests/run.php` covers `src/` — the HMAC
# canonicalisation, the proof-of-control hash, the vendored currency exponent
# table — which is copied verbatim into BOTH archives, so one run covers both
# majors. It cannot boot OpenCart, so the adapters, the catalogue walk and the
# drain are not covered here; the bash guards in `bin/` cover the adapters by
# checking each major wires what it must, and the honest verification for the
# rest is still an archive installed through each back office.
#
# PHP VERSIONS ARE A MATRIX because merchants are. OpenCart 3 and 4 run on a wide
# spread of host PHP, and this module ships to whatever is already there.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Tests
        run: php tests/run.php

      # The build lints every shipped file and runs each self-testing guard in
      # bin/ before it packages anything, so this step also proves the guards
      # still discriminate — and that both archives can actually be produced.
      - name: Build both archives
        run: ./bin/build-module.sh
